<section class="share-panel" aria-label="Compartir agenda">
 <div class="share-controls"><label>Tu nombre<input id="person-name" maxlength="60" autocomplete="given-name" placeholder="Escribe tu nombre"></label><button id="invite-friend" type="button" hidden>Invitar a César</button><button id="send-selection" class="primary" type="button">Generar enlace de mi selección</button></div>
 <p class="share-help">César elige sus sesiones y te envía su enlace de selección. Al abrirlo podrás verlas y compararlas con las tuyas. Los enlaces son una copia de la selección; no se actualizan automáticamente.</p>
 <div id="share-status" role="status" aria-live="polite"></div>
 <div id="share-result" hidden><label id="result-label" for="result-url">Enlace</label><input id="result-url" readonly><button id="copy-result" type="button">Copiar enlace</button></div>
 <div class="person-tabs"><button id="my-view" type="button">Mi agenda</button><button id="shared-view" type="button" hidden>Selección recibida</button></div>
</section>
